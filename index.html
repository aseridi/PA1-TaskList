<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset ="utf-8">
    <title>My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1 class="page-title">My Task List</h1>
  </header>

  <main class="page-main">
    <form id="task-form" class="task-form">
      <div class="field">
        <label class="field__label" for="task-input">Task</label>
        <input class="field__input" id="task-input" type="text" placeholder="Task title">
      </div>

      <div class="field">
        <label class="field__label" for="task-description">Description</label>
        <input class="field__input" id="task-description" type="text" placeholder="A brief description of the task">
      </div>

      <div class="field">
        <label class="field__label" for="priority">Priority</label>
        <select class="field__input" id="priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <button class="btn btn--submit" type="submit">Add Task</button>
    </form>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <footer class="page-footer">Ahmed Seridi — ICSI 418Y</footer>
</body>
</html>
